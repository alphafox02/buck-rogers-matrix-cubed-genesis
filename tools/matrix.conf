# Run the DOS original, to settle by ear which song each cue plays.
#
# MATRIX.CFG in the game directory names C:\MATRIX\SAVE\, so dos_game is
# mounted as C: and the game sits at C:\MATRIX exactly as it expects.
[sblaster]
sbtype=sb16
oplmode=auto

[autoexec]
mount c /home/dragon/Downloads/matrix_cubed/dos_game
c:
cd MATRIX
START.EXE
