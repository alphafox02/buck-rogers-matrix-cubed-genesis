# Run the DOS original, to compare behaviour against the port.
#
# Run it from the repository root, since the mount below is relative:
#     dosbox -conf tools/matrix.conf
#
# MATRIX.CFG in the game directory names C:\MATRIX\SAVE\, so dos_game is
# mounted as C: and the game sits at C:\MATRIX exactly as it expects.
#
# The cycle count matters: with DOSBox's default the game is sluggish enough
# that keypresses look like they are being ignored, which reads as "it will
# not let me play".
[sdl]
autolock=false
windowresolution=960x720
output=surface

[cpu]
core=auto
cputype=auto
cycles=fixed 20000

[sblaster]
sbtype=sb16
oplmode=auto

[autoexec]
mount c dos_game
c:
cd MATRIX
START.EXE
