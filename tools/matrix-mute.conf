# Run the DOS original with its sound silenced, for side-by-side recording
# against the port.
#
#     dosbox -conf tools/matrix-mute.conf
#
# `nosound` silences the OUTPUT while still emulating the sound hardware, so
# the game runs at exactly the timing it would with audio on. Turning the
# sound card off in the game's own setup instead would change what it does,
# which is the wrong thing to do when the point is to compare behaviour.
#
# Everything else matches tools/matrix.conf.
[sdl]
autolock=false
windowresolution=960x720
output=surface

[cpu]
core=auto
cputype=auto
cycles=fixed 20000

[sblaster]
sbtype=sb16
oplmode=auto

[autoexec]
mount c dos_game
c:
cd MATRIX
START.EXE

[mixer]
nosound=true
